name: Profile assets

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  stats:
    name: Stats cards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # garikcareer.com palette: dark theme (#0d1117 / #00ff41) and light theme (#ffffff / #2da44e)
      DARK: bg_color=0d1117&title_color=00ff41&icon_color=00ff41&text_color=c9d1d9&border_color=30363d
      LIGHT: bg_color=ffffff&title_color=2da44e&icon_color=2da44e&text_color=1f2328&border_color=d1d9e0
      STATS: show_icons=true&hide_rank=true&include_all_commits=true&hide=stars,issues,contribs&show=prs_merged&card_width=420
      LANGS: layout=compact&langs_count=3&card_width=340
    steps:
      - uses: actions/checkout@v7

      - name: Check STATS_TOKEN
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          if [ -z "$STATS_TOKEN" ]; then
            echo "::warning::STATS_TOKEN is not visible to this workflow, so the cards count public repositories only. Add it under this repository's Settings > Secrets and variables > Actions > Repository secrets."
            exit 0
          fi
          if ! headers=$(curl -fsS -o /dev/null -D - -H "Authorization: Bearer $STATS_TOKEN" https://api.github.com/user); then
            echo "::error::GitHub rejected STATS_TOKEN (expired or revoked?). Create a new classic token with the repo and read:user scopes."
            exit 1
          fi
          scopes=$(printf '%s' "$headers" | tr -d '\r' | sed -n 's/^x-oauth-scopes: *//Ip')
          echo "STATS_TOKEN scopes: ${scopes:-none reported}"
          case ", $scopes," in
            *", repo,"*) ;;
            *) echo "::warning::STATS_TOKEN has no repo scope (fine-grained tokens report none), so private repositories will not count. Use a classic token with repo and read:user." ;;
          esac

      - name: Stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&${{ env.STATS }}&${{ env.DARK }}
          path: profile/stats-dark.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&${{ env.STATS }}&${{ env.LIGHT }}
          path: profile/stats-light.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Top languages card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&${{ env.LANGS }}&${{ env.DARK }}
          path: profile/top-langs-dark.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Top languages card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&${{ env.LANGS }}&${{ env.LIGHT }}
          path: profile/top-langs-light.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit the cards
        run: |
          # The cards are generated files, so they go on top of whatever main is now: a push made
          # while this job ran, or a re-run of an older run, can leave the checkout behind main.
          mkdir -p "$RUNNER_TEMP/cards"
          cp profile/*.svg "$RUNNER_TEMP/cards/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --depth=1 origin "$GITHUB_REF_NAME"
            git checkout -f -B "$GITHUB_REF_NAME" FETCH_HEAD
            mkdir -p profile
            cp "$RUNNER_TEMP"/cards/*.svg profile/
            git add profile/*.svg
            if git diff --cached --quiet; then
              echo "The cards are unchanged."
              exit 0
            fi
            git commit -m "chore: refresh profile stats cards"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error::Could not push the cards after 3 attempts."
          exit 1

  snake:
    name: Contribution snake
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate the snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#1f2328
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00ff41

      - name: Publish them to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
