name: Profile assets

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  streak:
    name: Streak card
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMMON: user=${{ github.repository_owner }}&mode=weekly&timezone=America/Los_Angeles&disable_animations=true
      DARK: background=0d1117&border=30363d&stroke=30363d&ring=00ff41&fire=00ff41&currStreakNum=00ff41&currStreakLabel=00ff41&sideNums=c9d1d9&sideLabels=c9d1d9&dates=8b949e
      LIGHT: background=ffffff&border=d1d9e0&stroke=d1d9e0&ring=2da44e&fire=2da44e&currStreakNum=1f2328&currStreakLabel=1a7f37&sideNums=1f2328&sideLabels=1f2328&dates=57606a
    steps:
      - uses: actions/checkout@v7

      - name: Streak card (dark)
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: ${{ env.COMMON }}&${{ env.DARK }}
          path: profile/streak-dark.svg

      - name: Streak card (light)
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: ${{ env.COMMON }}&${{ env.LIGHT }}
          path: profile/streak-light.svg

      - name: Commit the cards
        run: |
          # The cards are generated files, so they go on top of whatever main is now: a push made
          # while this job ran, or a re-run of an older run, can leave the checkout behind main.
          mkdir -p "$RUNNER_TEMP/cards"
          cp profile/streak-*.svg "$RUNNER_TEMP/cards/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --depth=1 origin "$GITHUB_REF_NAME"
            git checkout -f -B "$GITHUB_REF_NAME" FETCH_HEAD
            mkdir -p profile
            cp "$RUNNER_TEMP"/cards/*.svg profile/
            # The old stats cards needed a personal token; removed once, harmless afterwards
            git rm -q --ignore-unmatch profile/stats-*.svg profile/top-langs-*.svg
            git add profile/streak-*.svg
            if git diff --cached --quiet; then
              echo "The cards are unchanged."
              exit 0
            fi
            git commit -m "chore: refresh profile streak card"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error::Could not push the cards after 3 attempts."
          exit 1

  snake:
    name: Contribution snake
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate the snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#1f2328
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00ff41

      - name: Publish them to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
